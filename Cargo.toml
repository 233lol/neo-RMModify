[workspace]
resolver = "2"
members = [
    "crates/rgss-marshal",
    "crates/rgss-lcf",
    "crates/rgss-db",
    "crates/rgss-save",
    "crates/rgss-wolf",
    "crates/editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
